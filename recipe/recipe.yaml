context:
  name: esssans
  version: "26.10.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/esssans-${{ version }}.tar.gz
  sha256: 741eb4d70e1e428b61cd55dd00dc6abb714bb87025b7828c8324c943c12902b4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - dask-core >=2022.1.0
    - python-graphviz >=0.20
    - essreduce >=26.10.1
    - numpy >=1.26.4
    - pandas >=2.1.2
    - plopp >=26.5.0
    - scippneutron >=26.10.0

tests:
  - python:
      imports:
        - ess.sans
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: SANS data reduction for the European Spallation Source
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/scipp/ess/tree/main/packages/esssans
  homepage: https://scipp.github.io/ess/sans/

extra:
  recipe-maintainers:
    - MridulS
    - conda-forge/scipp
